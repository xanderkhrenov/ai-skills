services:
  backend:
    image: __PROJECT_NAME__-backend:local
    build:
      context: .
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: "127.0.0.1:9090"
  ui:
    image: __PROJECT_NAME__-ui:local
    build:
      context: ./ui
    ports:
      - "8080:8080"
    depends_on:
      - backend
