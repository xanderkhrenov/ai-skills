{
  "version": "v2",
  "managed": {
    "enabled": true,
    "disable": [
      {
        "file_option": "go_package",
        "module": "buf.build/googleapis/googleapis"
      },
      {
        "file_option": "go_package",
        "module": "buf.build/grpc-ecosystem/grpc-gateway"
      }
    ],
    "override": [
      {
        "file_option": "go_package_prefix",
        "value": "__MODULE_PATH__/internal/gen"
      }
    ]
  },
  "plugins": [
    {
      "local": [
        "go",
        "run",
        "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12"
      ],
      "out": "../internal/gen",
      "opt": [
        "paths=source_relative"
      ]
    },
    {
      "local": [
        "go",
        "run",
        "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2"
      ],
      "out": "../internal/gen",
      "opt": [
        "paths=source_relative"
      ]
    },
    {
      "local": [
        "go",
        "run",
        "github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v2.33.0"
      ],
      "out": "../internal/gen",
      "opt": [
        "paths=source_relative"
      ]
    },
    {
      "local": [
        "go",
        "run",
        "github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@v2.33.0"
      ],
      "out": "openapi",
      "opt": [
        "allow_merge=true",
        "merge_file_name=__PROJECT_NAME__",
        "output_format=yaml"
      ]
    }
  ],
  "inputs": [
    {
      "directory": "proto/__PROJECT_NAME__"
    }
  ]
}
